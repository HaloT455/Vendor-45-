name: ALICE A16 Camera Metadata FastPath + Face Iris Audit (UNTESTED)

on:
  push:
    branches: ["work/a16-camera-fast-metadata-face-iris-audit"]
    paths:
      - "tools/native_camera/**"
      - "tools/stage_hlong_camera_wrapper.py"
      - "tools/build_samsung_preview_bridge.py"
      - "tools/integrate_hlong_camera_trial.py"
      - "tools/integrate_samsung_preview_bridge_trial.py"
      - "tools/test_camera_video6_contract.py"
      - "vendor/build.prop"
      - "vendor/etc/init/**"
      - "tools/test_camera_fast_biometric_contract.py"
      - ".github/workflows/alice-a16-camera-fast-face-iris-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-preview-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout combined experimental branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard original baseline and preserve two-SIM vendor config
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/a16-camera-fast-metadata-face-iris-audit"
          test "$(git rev-parse refs/remotes/origin/baseline/test7)" = "d5748652ddf1eb4cdc18d2f51cbbde8f6fd16170"
          python3 tools/test_vendor_config_fixes.py
          grep -qx 'ro.telephony.default_network=9,9' vendor/build.prop
          ! grep -q 'setprop ro.telephony.default_network' vendor/etc/init/init.vendor.rilcommon.rc
          # Keep vendor payload, Camera photo/video metadata configuration,
          # and radio firmware byte-for-byte identical to Camera+Video6 baseline.
          git diff --exit-code refs/remotes/origin/work/a16-camera-video6-metadata-fix HEAD -- vendor metadata
          # No changes to camera native sources except cache fast path.
          changed="$(git diff --name-only refs/remotes/origin/work/a16-camera-video6-metadata-fix HEAD -- tools/native_camera)"
          test "$changed" = "tools/native_camera/alice_preview_bridge.c"
          echo "PASS: vendor bytes unchanged; only preview bridge C fast-path differs"

      - name: Host ELF and EROFS build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev
          python3 tools/setup_erofs.py

      - name: Validate Oct 19 preview and Oct 20 video FPS crash regression
        run: |
          python3 tools/camera_preview_contract.py --selftest
          python3 tools/test_camera_regression_20261019.py
          python3 tools/test_camera_video6_contract.py
          python3 tools/test_camera_fast_biometric_contract.py

      - name: Verify source vendor and legacy HALs
        run: |
          python3 tools/audit_vendor_camera_ril.py --output out/camera-radio-source-audit.json
          python3 tools/build_vendor.py --verify-only --allow-file-changes

      - name: Audit Samsung face service ELF and linked Android interface
        shell: bash
        run: |
          set -euo pipefail
          readelf -h vendor/bin/hw/vendor.samsung.hardware.biometrics.face-service
          readelf -d vendor/bin/hw/vendor.samsung.hardware.biometrics.face-service | grep NEEDED | head -30
          test -s vendor/lib64/android.hardware.biometrics.face-V2-ndk.so
          echo "Face ELF + library exists. Device service registration or enrollment is NOT confirmed."

      - name: Fetch SHA-pinned original Exynos8895 UN1GAGA wrapper
        run: |
          python3 tools/stage_hlong_camera_wrapper.py --output out/stage_hlong_camera
          python3 tools/integrate_hlong_camera_trial.py --stage out/stage_hlong_camera --report out/camera-wrapper-stage.json

      - name: Set up SDK command-line tools for Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned NDK r27c for 32-bit and 64-bit HAL
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --install "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Compile and integrate Samsung preview and picture vendor-tag bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_samsung_preview_bridge.py --ndk "$ANDROID_HOME/ndk/27.2.12479018" --output out/stage_preview_bridge
          python3 tools/integrate_samsung_preview_bridge_trial.py --stage out/stage_preview_bridge --report out/preview-bridge-stage.json
          for abi in lib lib64; do
            test -s "vendor/$abi/hw/camera.universal8895.so"
            test -s "vendor/$abi/hw/camera.alice-hlong.universal8895.so"
            test -s "vendor/$abi/hw/camera.vendor.universal8895.so"
            readelf --dyn-syms --wide "vendor/$abi/hw/camera.universal8895.so" | grep -E '[[:space:]]HMI$'
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          props=Path("vendor/build.prop").read_text()
          assert props.count("ro.telephony.default_network=9,9\n")==1
          m=json.loads(Path("metadata/vendor-image-manifest.json").read_text())
          assert len(m["entries"])==1433, len(m["entries"])
          print("PASS: 1433 entries, 32/64 HAL preservation, DSDS default_network=9,9")
          PY

      - name: Validate EROFS including changed camera modules
        run: python3 tools/build_vendor.py --verify-only --allow-file-changes

      - name: Build combined DSDS and Camera experimental vendor EROFS image
        run: |
          python3 tools/build_vendor.py --allow-file-changes --max-image-bytes 629145600 --output out/vendor-a16-fast-metadata-face-iris-audit-UNTESTED.img

      - name: Verify output report, EROFS magic and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s out/vendor-a16-fast-metadata-face-iris-audit-UNTESTED.img
          test "$(od -An -tx4 -j1024 -N4 out/vendor-a16-fast-metadata-face-iris-audit-UNTESTED.img | tr -d ' ')" = e0f5e1e2
          sha256sum out/vendor-a16-fast-metadata-face-iris-audit-UNTESTED.img > out/CAMERA-FAST-METADATA-SHA256SUMS
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          img=Path("out/vendor-a16-fast-metadata-face-iris-audit-UNTESTED.img")
          report=json.loads(Path("out/vendor-a16-fast-metadata-face-iris-audit-UNTESTED.report.json").read_text())
          assert report["verified"] and report["entries"]==1433
          assert report["rebuilt_image_sha256"]==hashlib.sha256(img.read_bytes()).hexdigest()
          print("Physical file size:",img.stat().st_size)
          print("Original source size: 481640448 bytes")
          print("EXPERIMENTAL ONLY; compare actual physical vendor partition before flashing")
          PY

      - name: Add honest runtime and rollback warning
        if: always()
        shell: bash
        run: |
          echo "### Camera metadata fast path and biometric audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Metadata cache fast-path experiment: first read builds immutable Samsung Camera2 tags, repeated calls avoid mutex via atomic acquire/release. Actual JPEG shutter improvement NOT verified." >> "$GITHUB_STEP_SUMMARY"
          echo "Retains six-int Video6 tags, delegate Camera HAL, 32/64 ABIs, vendor and modem configurations. Face AIDL present in original vendor; iris implementation not proven. CI does not create or bypass biometrics." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT device tested. Photo capture latency and face/iris unlock NOT CONFIRMED; diagnostic prerequisite is measured runtime status. NO fake biometric service." >> "$GITHUB_STEP_SUMMARY"
          echo "DO NOT FLASH without checking actual vendor partition size, boot/SELinux compatibility and recovery rollback." >> "$GITHUB_STEP_SUMMARY"

      - name: Save research-only vendor image and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-A16-CAMERA-FAST-METADATA-FACE-IRIS-AUDIT-UNTESTED-NO-FLASH
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn
          path: |
            out/camera-radio-source-audit.json
            out/camera-wrapper-stage.json
            out/preview-bridge-stage.json
            out/stage_preview_bridge/build-report.json
            out/CAMERA-FAST-METADATA-SHA256SUMS
            out/vendor-a16-fast-metadata-face-iris-audit-UNTESTED.img
            out/vendor-a16-fast-metadata-face-iris-audit-UNTESTED.report.json
