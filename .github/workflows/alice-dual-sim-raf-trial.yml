name: ALICE Android16 DSDS default network vendor test (UNTESTED)

on:
  push:
    branches: ["work/dual-sim-lte-raf-trial"]
    paths:
      - "vendor/build.prop"
      - "vendor/etc/init/init.vendor.rilcommon.rc"
      - "tools/test_vendor_config_fixes.py"
      - ".github/workflows/alice-dual-sim-raf-trial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental-vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout experimental ALICE vendor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protect baseline and limit vendor edits to two radio config files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/dual-sim-lte-raf-trial"
          test "$(git rev-parse refs/remotes/origin/baseline/test7)" = "d5748652ddf1eb4cdc18d2f51cbbde8f6fd16170"
          diff="$(git diff --name-only refs/remotes/origin/work/android16-vendor-compat HEAD -- vendor metadata)"
          echo "$diff"
          test "$diff" = "$(printf 'vendor/build.prop\nvendor/etc/init/init.vendor.rilcommon.rc')"
      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev
      - name: Verify legacy DSDS property list and radio VINTF
        run: |
          python3 tools/test_vendor_config_fixes.py
          python3 tools/audit_vendor_camera_ril.py --output out/ril-audit.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/build.prop").read_text()
          assert p.count("ro.telephony.default_network=9,9\n") == 1
          assert "ro.vndk.version=33" in p
          assert "ro.vendor.build.version.sdk=33" in p
          print("PASS: Android16 two-phone default network config; legacy VNDK retained")
          PY
      - name: Install reproducible EROFS tooling
        run: python3 tools/setup_erofs.py
      - name: Verify changed vendor contents without changing original manifest
        run: python3 tools/build_vendor.py --verify-only --allow-file-changes
      - name: Build experimental DSDS vendor.img with headroom, not for flashing
        run: |
          python3 tools/build_vendor.py --allow-file-changes --max-image-bytes 498417664 --output out/vendor-dsds-default9x2-UNTESTED.img
      - name: Explain image safety boundaries
        if: always()
        shell: bash
        run: |
          echo "DSDS 9,9 fixes per-phone default selection only. No proof of LTE attach or simultaneous Dual LTE." >> "$GITHUB_STEP_SUMMARY"
          echo "This test image MUST NOT be flashed until real vendor partition size and recovery rollback are established." >> "$GITHUB_STEP_SUMMARY"
          test ! -f out/vendor-dsds-default9x2-UNTESTED.report.json || cat out/vendor-dsds-default9x2-UNTESTED.report.json
      - name: Retain experimental EROFS image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-S8Plus-A16-DSDS-DEFAULT9x2-UNTESTED-DO-NOT-FLASH
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn
          path: |
            out/ril-audit.json
            out/vendor-dsds-default9x2-UNTESTED.img
            out/vendor-dsds-default9x2-UNTESTED.report.json
