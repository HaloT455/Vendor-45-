name: ALICE S8P SIM2 LTE Android16 RIL A-B + Camera Video6 CI

on:
  push:
    branches: ["work/a16-sim2-lte-ab-20261023"]
    paths:
      - "tools/native_camera/**"
      - "tools/stage_hlong_camera_wrapper.py"
      - "tools/build_samsung_preview_bridge.py"
      - "tools/integrate_hlong_camera_trial.py"
      - "tools/integrate_samsung_preview_bridge_trial.py"
      - "tools/test_camera_video6_contract.py"
      - "vendor/build.prop"
      - "vendor/etc/init/**"
      - "tools/test_camera_fast_biometric_contract.py"
      - "tools/alice_system_v2_face_iris_audit.py"
      - "tools/test_system_v2_face_iris_audit.py"
      - "tools/test_shutter_feature_gate.py"
      - "tools/test_sim_reference_regression.py"
      - "tools/test_sim_pair_contract.py"
      - "tools/alice_sim2_lte_handoff_probe.py"
      - "tools/alice_dds_lte_post_switch_triage.py"
      - "tools/alice_lte_slot1_policy_trial.py"
      - "tools/alice_radio_capability_raf0_audit.py"
      - "tools/test_android16_phone_raf0_trial_patch.py"
      - "tools/test_android16_ril_raf0_resource_fallback.py"
      - "patches/android16/**"
      - "docs/ALICE_SIM_REFERENCE_20261023.md"
      - "vendor/etc/alice-test7/camera-feature.xml"
      - ".github/workflows/alice-a16-camera-fast-face-iris-audit.yml"
      - ".github/workflows/alice-a16-samsung-video6-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-preview-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout combined experimental branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned R16 kernel source for paired compatibility
        uses: actions/checkout@v4
        with:
          repository: HaloT455/dream2lte-45
          ref: b892e28db47fb9aaf2df8d3196050a76288b6caf
          path: pair-kernel
          persist-credentials: false

      - name: Guard original baseline and preserve two-SIM vendor config
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/a16-sim2-lte-ab-20261023"
          test "$(git rev-parse refs/remotes/origin/baseline/test7)" = "d5748652ddf1eb4cdc18d2f51cbbde8f6fd16170"
          python3 tools/test_vendor_config_fixes.py
          grep -qx 'ro.telephony.default_network=9,9' vendor/build.prop
          ! grep -q 'setprop ro.telephony.default_network' vendor/etc/init/init.vendor.rilcommon.rc
          python3 tools/test_sim_reference_regression.py
          python3 tools/test_sim_pair_contract.py --kernel-root pair-kernel --output out/paired-simcam-contract.json
          python3 tools/alice_sim2_lte_handoff_probe.py --selftest
          python3 tools/alice_dds_lte_post_switch_triage.py --selftest
          python3 tools/alice_lte_slot1_policy_trial.py --selftest
          python3 tools/alice_radio_capability_raf0_audit.py --selftest
          python3 tools/test_android16_phone_raf0_trial_patch.py
          python3 tools/test_android16_ril_raf0_resource_fallback.py
          # Only known Camera A/B flags + restored reference RIL init may differ.
          changed="$(git diff --name-only refs/remotes/origin/work/a16-camera-fast-metadata-face-iris-audit HEAD -- vendor metadata)"
          expected="vendor/etc/alice-test7/camera-feature.xml"
          test "$changed" = "$expected"
          python3 tools/test_shutter_feature_gate.py
          git diff --exit-code refs/remotes/origin/work/a16-camera-fast-metadata-face-iris-audit HEAD -- tools/native_camera
          echo "PASS: Camera Video6 unchanged; late immutable network default overwrite removed; Samsung NetworkConfig preserved"

      - name: Host ELF and EROFS build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev
          python3 tools/setup_erofs.py

      - name: Validate Oct 19 preview and Oct 20 video FPS crash regression
        run: |
          python3 tools/camera_preview_contract.py --selftest
          python3 tools/test_camera_regression_20261019.py
          python3 tools/test_camera_video6_contract.py
          python3 tools/test_camera_fast_biometric_contract.py
          python3 tools/test_shutter_feature_gate.py
          python3 tools/test_sim_reference_regression.py
          python3 tools/test_system_v2_face_iris_audit.py

      - name: Verify source vendor and legacy HALs
        run: |
          python3 tools/audit_vendor_camera_ril.py --output out/camera-radio-source-audit.json
          python3 tools/build_vendor.py --verify-only --allow-file-changes

      - name: Audit Samsung face service ELF and linked Android interface
        shell: bash
        run: |
          set -euo pipefail
          readelf -h vendor/bin/hw/vendor.samsung.hardware.biometrics.face-service
          readelf -d vendor/bin/hw/vendor.samsung.hardware.biometrics.face-service | grep NEEDED | head -30
          test -s vendor/lib64/android.hardware.biometrics.face-V2-ndk.so
          echo "Face ELF + library exists. Device service registration or enrollment is NOT confirmed."

      - name: Fetch SHA-pinned original Exynos8895 UN1GAGA wrapper
        run: |
          python3 tools/stage_hlong_camera_wrapper.py --output out/stage_hlong_camera
          python3 tools/integrate_hlong_camera_trial.py --stage out/stage_hlong_camera --report out/camera-wrapper-stage.json

      - name: Set up SDK command-line tools for Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned NDK r27c for 32-bit and 64-bit HAL
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --install "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Compile and integrate Samsung preview and picture vendor-tag bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_samsung_preview_bridge.py --ndk "$ANDROID_HOME/ndk/27.2.12479018" --output out/stage_preview_bridge
          python3 tools/integrate_samsung_preview_bridge_trial.py --stage out/stage_preview_bridge --report out/preview-bridge-stage.json
          for abi in lib lib64; do
            test -s "vendor/$abi/hw/camera.universal8895.so"
            test -s "vendor/$abi/hw/camera.alice-hlong.universal8895.so"
            test -s "vendor/$abi/hw/camera.vendor.universal8895.so"
            readelf --dyn-syms --wide "vendor/$abi/hw/camera.universal8895.so" | grep -E '[[:space:]]HMI$'
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          props=Path("vendor/build.prop").read_text()
          assert props.count("ro.telephony.default_network=9,9\n")==1
          m=json.loads(Path("metadata/vendor-image-manifest.json").read_text())
          assert len(m["entries"])==1433, len(m["entries"])
          print("PASS: 1433 entries, 32/64 HAL preservation, DSDS default_network=9,9")
          PY

      - name: Validate EROFS including changed camera modules
        run: python3 tools/build_vendor.py --verify-only --allow-file-changes

      - name: Build combined DSDS and Camera experimental vendor EROFS image
        run: |
          python3 tools/build_vendor.py --allow-file-changes --max-image-bytes 629145600 --output out/vendor-a16-sim2-lte-ril-ab-video6-UNTESTED.img

      - name: Verify output report, EROFS magic and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s out/vendor-a16-sim2-lte-ril-ab-video6-UNTESTED.img
          test "$(od -An -tx4 -j1024 -N4 out/vendor-a16-sim2-lte-ril-ab-video6-UNTESTED.img | tr -d ' ')" = e0f5e1e2
          sha256sum out/vendor-a16-sim2-lte-ril-ab-video6-UNTESTED.img > out/CAMERA-SHUTTER-PHOTO-GATE-SHA256SUMS
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          img=Path("out/vendor-a16-sim2-lte-ril-ab-video6-UNTESTED.img")
          report=json.loads(Path("out/vendor-a16-sim2-lte-ril-ab-video6-UNTESTED.report.json").read_text())
          assert report["verified"] and report["entries"]==1433
          assert report["rebuilt_image_sha256"]==hashlib.sha256(img.read_bytes()).hexdigest()
          print("Physical file size:",img.stat().st_size)
          print("Original source size: 481640448 bytes")
          print("EXPERIMENTAL ONLY; compare actual physical vendor partition before flashing")
          PY

      - name: Add honest runtime and rollback warning
        if: always()
        shell: bash
        run: |
          echo "### ALICE A16 Samsung Camera 4-5s shutter lag photo-gate AB experiment" >> "$GITHUB_STEP_SUMMARY"
          echo "PAIR ALICE-S8P-A16-R16-SIMCAM-20261023: R16 modem Kconfig and the original Samsung RIL/Camera Video6 contracts checked. A static PASS does not mean device-ready." >> "$GITHUB_STEP_SUMMARY"
          echo "Removed a late immutable ro.telephony.default_network write; this is an A/B fix for init correctness, NOT two independent LTE registrations." >> "$GITHUB_STEP_SUMMARY"
          echo "Hypothesis: scene detection/auto night may delay photo. This is NOT a proven 4-5s fix; measure shutter-to-JPEG on device before flashing and after safe rollback-capable flash." >> "$GITHUB_STEP_SUMMARY"
          echo "Face service is already registered in device evidence but enrollment blank; Iris is not exposed. This Camera-only AB test does NOT repair Face/Iris or Viettel LTE." >> "$GITHUB_STEP_SUMMARY"
          echo "DO NOT FLASH without checking actual vendor partition size, boot/SELinux compatibility and recovery rollback." >> "$GITHUB_STEP_SUMMARY"

      - name: Save research-only vendor image and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-S8P-A16-SIM2-LTE-RIL-AB-VIDEO6-UNTESTED-NO-FLASH
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn
          path: |
            out/paired-simcam-contract.json
            tools/alice_sim2_lte_handoff_probe.py
            out/camera-radio-source-audit.json
            out/camera-wrapper-stage.json
            out/preview-bridge-stage.json
            out/stage_preview_bridge/build-report.json
            out/CAMERA-SHUTTER-PHOTO-GATE-SHA256SUMS
            out/vendor-a16-sim2-lte-ril-ab-video6-UNTESTED.img
            out/vendor-a16-sim2-lte-ril-ab-video6-UNTESTED.report.json
