name: ALICE Camera + dual-SIM radio EROFS experiment
on:
  push:
    branches: ["work/**"]
    paths:
      - "tools/stage_hlong_camera_wrapper.py"
      - "tools/integrate_hlong_camera_trial.py"
      - "tools/build_vendor.py"
      - "tools/stage_radio_raf_overlay.py"
      - "tools/integrate_radio_raf_trial.py"
      - ".github/workflows/alice-camera-wrapper-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout vendor research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce immutable ALICE source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/baseline/test7)" = d5748652ddf1eb4cdc18d2f51cbbde8f6fd16170
          case "$GITHUB_REF_NAME" in work/*) ;; *) echo "Only work branches"; exit 1 ;; esac
      - name: Install pinned EROFS utilities and readelf
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev
          python3 tools/setup_erofs.py
      - name: Verify pristine Test7 vendor research input
        run: |
          python3 tools/test_vendor_config_fixes.py
          python3 tools/build_vendor.py --verify-only --allow-file-changes
      - name: Download SHA-pinned wrapper and preserve legacy 32/64 HAL
        run: |
          python3 tools/stage_hlong_camera_wrapper.py --output out/stage_hlong_camera
          python3 tools/integrate_hlong_camera_trial.py \
            --stage out/stage_hlong_camera \
            --report out/camera-integration-trial.json
      - name: Check wrapper ELF exported HAL module symbols and runtime deps
        run: |
          set -euo pipefail
          for abi in lib lib64; do
            wrapper="vendor/$abi/hw/camera.universal8895.so"
            backup="vendor/$abi/hw/camera.vendor.universal8895.so"
            readelf -h "$wrapper" | grep -E 'Class:|Machine:'
            # Android hardware.h uses HAL_MODULE_INFO_SYM, which expands to ELF symbol HMI.
            readelf --dyn-syms --wide "$wrapper" | grep -E '[[:space:]]HMI$'
            readelf -d "$wrapper" | grep -F '(NEEDED)' || true
            test -s "$backup"
          done
      - name: Bootstrap current Android command-line SDK without deprecated tools package
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android API36 platform and AAPT2
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compile static GSM/WCDMA/LTE RAF fallback for unsupported RIL
        run: |
          python3 tools/stage_radio_raf_overlay.py \
            --sdk "${ANDROID_HOME}" \
            --output out/ALICE-RadioRAF.apk
          python3 tools/integrate_radio_raf_trial.py \
            --apk out/ALICE-RadioRAF.apk \
            --report out/alice-radio-raf-trial.json
      - name: Verify expanded metadata and modified paths
        run: python3 tools/build_vendor.py --verify-only --allow-file-changes
      - name: Build self-checking experimental EROFS (NEVER FLASH)
        run: |
          python3 tools/build_vendor.py \
            --allow-file-changes \
            --max-image-bytes 629145600 \
            --output out/vendor.img
      - name: Verify delivered vendor.img checksum and EROFS magic
        run: |
          set -euo pipefail
          test -s out/vendor.img
          test "$(od -An -tx4 -j1024 -N4 out/vendor.img | tr -d ' ')" = e0f5e1e2
          sha256sum out/vendor.img | tee out/SHA256SUMS
          test -s out/vendor.report.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          image=pathlib.Path("out/vendor.img")
          report=json.loads(pathlib.Path("out/vendor.report.json").read_text())
          assert report["verified"] is True and report["entries"] == 1433
          assert report["rebuilt_image_bytes"] == image.stat().st_size
          assert report["rebuilt_image_sha256"] == hashlib.sha256(image.read_bytes()).hexdigest()
          print("PASS: vendor.img matches verified EROFS report")
          PY
      - name: Research-only results
        if: always()
        shell: bash
        run: |
          for f in out/camera-integration-trial.json out/alice-radio-raf-trial.json out/vendor.report.json; do
            if [ -f "$f" ]; then cat "$f"; fi
          done
          echo "## vendor.img — CAMERA+RAF experiment" >> "$GITHUB_STEP_SUMMARY"
          echo "Offline validated EROFS only; no S8+ hardware, camera app, idmap, or LTE registration test. **DO NOT FLASH.**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f out/SHA256SUMS ]; then cat out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain experimental image for analysis (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-Test7-Camera-Radio-vendor-img-UNTESTED
          if-no-files-found: warn
          retention-days: 3
          compression-level: 1
          path: |
            out/camera-integration-trial.json
            out/alice-radio-raf-trial.json
            out/ALICE-RadioRAF.apk
            out/SHA256SUMS
            out/vendor.report.json
            out/vendor.img
